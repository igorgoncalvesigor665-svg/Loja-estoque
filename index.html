(()=>{

const TABLE='oficina_dados';

let sessionUser=null;

const emptyData=()=>({products:[],clients:[],quotes:[],expenses:[],movements:[],sales:[],settings:{shopName:'Oficina',currency:'BRL'}});
let db=emptyData();let page='dashboard';let quoteFilter='all';let workFilter='all';let inventorySearch='';let quoteSearch='';let clientSearch='';

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));updateNav();
 if(!sessionUser||!supabaseClient||!syncing)return;
 clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{
  try{const {error}=await supabaseClient.from(TABLE).upsert({user_id:sessionUser.id,app_data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;setSyncStatus('Dados sincronizados');}
  catch(err){setSyncStatus('Falha ao sincronizar. Confira a tabela e as políticas do Supabase.');console.error('Supabase sync:',err)}
 },450);

function setSyncStatus(message){const el=document.getElementById('syncStatus');if(el)el.textContent=message}
function updateNav(){const el=document.getElementById('navQuotes');if(el)el.textContent=db.quotes.filter(q=>q.status==='pending').length}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">'+escapeHtml(msg)+'</div>';setTimeout(()=>root.innerHTML='',2800)}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
const menuToggle=document.getElementById('menuToggle');if(menuToggle)menuToggle.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
const todayLabel=document.getElementById('todayLabel');if(todayLabel)todayLabel.textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const titles={dashboard:['Painel geral','Visão geral da oficina'],quotes:['Orçamentos','Crie propostas e acompanhe a aprovação'],workshop:['Oficina / manutenção','Acompanhe o serviço desde a entrada até a entrega'],inventory:['Estoque','Produtos, quantidades e movimentações'],clients:['Clientes','Cadastro e histórico de atendimento'],cash:['Caixa e despesas','Recebimentos, pagamentos e despesas'],reports:['Relatórios','Indicadores e resultados do negócio'],settings:['Configurações','Preferências e sincronização da conta']};
function render(){document.getElementById('crumb').textContent=titles[page][0];document.getElementById('topTitle').textContent=titles[page][1];const c=document.getElementById('content');c.innerHTML=({dashboard:dashboardPage,quotes:quotesPage,workshop:workshopPage,inventory:inventoryPage,clients:clientsPage,cash:cashPage,reports:reportsPage,settings:settingsPage}[page])();bindPage()}
function pageHead(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${button}</div></div>`}
function stat(label,value,foot,icon,accent=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon" ${accent?`style="background:${accent}"`:''}>${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function badge(status){const map={pending:['Aguardando','orange'],approved:['Aprovado','green'],rejected:['Rejeitado','red'],cancelled:['Cancelado','red'],waiting:['Aguardando início','orange'],progress:['Em manutenção','blue'],ready:['Pronta para entrega','green'],done:['Entregue','green']};const v=map[status]||[status,''];return `<span class="badge ${v[1]}">${v[0]}</span>`}
function quoteTotal(q){return q.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0)-(+q.discount||0)}
function paid(q){return (q.payments||[]).reduce((s,p)=>s+(+p.amount||0),0)}
function costTotal(q){return q.items.reduce((s,i)=>s+(+i.qty||0)*(+i.cost||0),0)}
function due(q){return Math.max(0,quoteTotal(q)-paid(q))}
function dashboardPage(){const open=db.quotes.filter(q=>['pending','approved'].includes(q.status));const inWork=db.quotes.filter(q=>q.status==='approved'&&['waiting','progress','ready'].includes(q.workStatus));const low=db.products.filter(p=>+p.qty<=+p.min);const revenue=db.sales.reduce((s,x)=>s+x.total,0)+db.quotes.reduce((s,q)=>s+paid(q),0);const outflow=db.expenses.reduce((s,x)=>s+x.amount,0);return `${pageHead('Bom dia!','Aqui está o resumo da sua bicicletaria.',`<button class="btn primary" data-action="new-quote">＋ Novo orçamento</button>`)}<div class="grid stats">${stat('Orçamentos em aberto',open.length,'Aguardando ou aprovados','🧾')}${stat('Serviços em andamento',inWork.length,'Na fila da oficina','🔧')}${stat('Produtos cadastrados',db.products.length,'Itens no catálogo','📦')}${stat('Estoque baixo',low.length,'Produtos no limite ou abaixo','⚠️')}</div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Orçamentos recentes</h2><p>Acompanhe os últimos atendimentos</p></div><button class="link-btn" data-page="quotes">Ver todos →</button></div>${db.quotes.length?`<div class="table-wrap"><table><thead><tr><th>Orçamento / cliente</th><th>Data</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${[...db.quotes].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5).map(q=>`<tr><td><div class="item-title">${q.id}</div><div class="item-sub">${escapeHtml(q.clientName)}</div></td><td>${dateFmt(q.date)}</td><td class="strong">${fmt(quoteTotal(q))}</td><td>${badge(q.status)}</td><td><button class="btn small" data-action="view-quote" data-id="${q.id}">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">🧾</div><strong>Nenhum orçamento ainda</strong>Crie o primeiro orçamento da oficina.</div>`}</section><section class="panel"><div class="panel-head"><div><h2>Estoque em atenção</h2><p>Produtos que precisam de reposição</p></div><button class="link-btn" data-page="inventory">Estoque →</button></div>${low.length?low.slice(0,5).map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px"><div><div class="item-title">${escapeHtml(p.name)}</div><div class="item-sub">${escapeHtml(p.category||'Sem categoria')}</div></div><span class="badge ${p.qty<=0?'red':'orange'}">${p.qty} un.</span></div>`).join(''):`<div class="empty"><div class="empty-icon">✓</div><strong>Estoque em dia</strong>Nenhum produto abaixo do mínimo.</div>`}</section></div><section style="margin-top:18px"><div class="panel-head"><div><h2>Acesso rápido</h2><p>Atalhos para as tarefas mais comuns</p></div></div><div class="grid quick-grid"><button class="quick" data-action="new-quote"><span class="quick-icon">🧾</span><span><strong>Novo orçamento</strong><small>Cliente, bicicleta, peças e serviços</small></span></button><button class="quick" data-action="new-product"><span class="quick-icon">📦</span><span><strong>Cadastrar peça</strong><small>Adicionar item ao estoque</small></span></button><button class="quick" data-page="workshop"><span class="quick-icon">🔧</span><span><strong>Abrir oficina</strong><small>Ver manutenções aprovadas</small></span></button></div></section><p class="small-note" style="margin-top:20px">Os indicadores são calculados a partir dos registros da sua conta.</p>`}
function quotesPage(){let arr=[...db.quotes].sort((a,b)=>b.createdAt-a.createdAt).filter(q=>(quoteFilter==='all'||q.status===quoteFilter)&&(`${q.id} ${q.clientName} ${q.model} ${q.brand}`).toLowerCase().includes(quoteSearch.toLowerCase()));return `${pageHead('Orçamentos','Monte propostas com peças do estoque, itens avulsos e mão de obra.',`<button class="btn primary" data-action="new-quote">＋ Novo orçamento</button>`)}<div class="toolbar"><input class="search" id="quoteSearch" placeholder="Buscar por número, cliente ou bicicleta..." value="${escapeHtml(quoteSearch)}"/><button class="btn" data-action="export-quotes">⇩ Exportar CSV</button></div><div class="filters">${[['all','Todos'],['pending','Aguardando'],['approved','Aprovados'],['rejected','Rejeitados'],['cancelled','Cancelados']].map(([k,v])=>`<button class="filter-btn ${quoteFilter===k?'active':''}" data-qfilter="${k}">${v}</button>`).join('')}</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Orçamento</th><th>Cliente / bicicleta</th><th>Data</th><th>Itens</th><th>Total</th><th>Pagamento</th><th>Status</th><th>Ações</th></tr></thead><tbody>${arr.length?arr.map(q=>`<tr><td><div class="item-title">${q.id}</div><div class="item-sub">Validade: ${q.validity||7} dias</div></td><td><div class="item-title">${escapeHtml(q.clientName)}</div><div class="item-sub">${escapeHtml([q.brand,q.model].filter(Boolean).join(' '))}</div></td><td>${dateFmt(q.date)}</td><td>${q.items.length}</td><td class="strong">${fmt(quoteTotal(q))}</td><td>${fmt(paid(q))}<div class="item-sub">Falta ${fmt(due(q))}</div></td><td>${badge(q.status)}</td><td><div class="actions"><button class="btn small" data-action="view-quote" data-id="${q.id}">Ver detalhes</button><button class="btn small danger" data-action="delete-record" data-kind="quote" data-id="${q.id}">Apagar</button>${q.status==='pending'?`<button class="btn small primary" data-action="approve-quote" data-id="${q.id}">Aprovar</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty"><div class="empty-icon">▤</div><strong>Nenhum orçamento encontrado</strong>Experimente mudar os filtros ou criar um orçamento.</div></td></tr>`}</tbody></table></div></section>`}
function workshopPage(){const arr=db.quotes.filter(q=>q.status==='approved'&&q.workStatus!=='done');const groups=[['waiting','Aguardando início'],['progress','Em manutenção'],['ready','Pronta para entrega']];return `${pageHead('Oficina / manutenção','Somente orçamentos aprovados entram na fila de serviço.',`<button class="btn" data-page="quotes">Ver orçamentos</button>`)}<div class="summary-strip"><div class="summary-chip">Na fila <strong>${arr.filter(q=>q.workStatus==='waiting').length}</strong></div><div class="summary-chip">Em manutenção <strong>${arr.filter(q=>q.workStatus==='progress').length}</strong></div><div class="summary-chip">Prontas <strong>${arr.filter(q=>q.workStatus==='ready').length}</strong></div></div><div class="grid work-grid">${groups.map(([key,label])=>{const items=arr.filter(q=>(q.workStatus||'waiting')===key);return `<section class="work-column"><div class="work-column-head"><span>${label}</span><span class="work-count">${items.length}</span></div>${items.length?items.map(q=>`<article class="work-card"><div style="display:flex;justify-content:space-between;gap:8px"><span class="badge ${key==='progress'?'blue':key==='ready'?'green':'orange'}">${q.id}</span><span class="muted" style="font-size:10px">${dateFmt(q.date)}</span></div><h3 style="margin-top:10px">${escapeHtml(q.clientName)}</h3><p>${escapeHtml([q.brand,q.model,q.color].filter(Boolean).join(' · ')||'Bicicleta não identificada')}</p><p>Serviço: ${escapeHtml(q.items.map(i=>i.description).slice(0,2).join(', '))}${q.items.length>2?'…':''}</p><p class="strong" style="color:var(--text)">${fmt(quoteTotal(q))} · falta ${fmt(due(q))}</p><div class="work-actions">${key==='waiting'?`<button class="btn primary" data-action="work-status" data-status="progress" data-id="${q.id}">Iniciar serviço</button>`:''}${key==='progress'?`<button class="btn primary" data-action="work-status" data-status="ready" data-id="${q.id}">Marcar pronta</button>`:''}${key==='ready'?`<button class="btn primary" data-action="work-status" data-status="done" data-id="${q.id}">Entregue</button>`:''}<button class="btn" data-action="view-quote" data-id="${q.id}">Detalhes</button></div></article>`).join(''):`<div class="empty-state">Nada por aqui</div>`}</section>`}).join('')}</div><p class="small-note" style="margin-top:14px">Ao marcar o serviço como Entregue, as peças de estoque incluídas no orçamento são baixadas automaticamente uma única vez. Confira as quantidades das peças no orçamento antes de finalizar.</p>`}
function inventoryPage(){let arr=db.products.filter(p=>(`${p.name} ${p.code} ${p.category}`).toLowerCase().includes(inventorySearch.toLowerCase()));const value=arr.reduce((s,p)=>s+p.qty*p.cost,0);return `${pageHead('Estoque','Cadastre peças, custos, preços de venda e estoque mínimo.',`<button class="btn" data-action="stock-entry">＋ Entrada / ajuste</button><button class="btn primary" data-action="new-product">＋ Nova peça</button>`)}<div class="grid stats">${stat('Produtos cadastrados',db.products.length,'Itens no catálogo','📦')}${stat('Unidades em estoque',db.products.reduce((s,p)=>s+p.qty,0),'Soma das quantidades','▤')}${stat('Valor de custo',fmt(db.products.reduce((s,p)=>s+p.qty*p.cost,0)),'Valor estimado das peças','＄')}${stat('Abaixo do mínimo',db.products.filter(p=>p.qty<=p.min).length,'Requer atenção','!')}</div><div class="toolbar"><input class="search" id="inventorySearch" placeholder="Buscar peça, código ou categoria..." value="${escapeHtml(inventorySearch)}"/><button class="btn" data-action="export-products">⇩ Exportar CSV</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Código de barras / SKU</th><th>Categoria</th><th>Custo</th><th>Venda</th><th>Margem bruta</th><th>Quantidade</th><th></th></tr></thead><tbody>${arr.length?arr.map(p=>`<tr><td><div class="item-title">${escapeHtml(p.name)}</div><div class="item-sub">${p.id}</div></td><td>${escapeHtml(p.code||'—')}</td><td>${escapeHtml(p.category||'—')}</td><td>${fmt(p.cost)}</td><td class="strong">${fmt(p.sale)}</td><td>${p.sale?Math.round((p.sale-p.cost)/p.sale*100)+'%':'—'}</td><td><span class="badge ${p.qty<=p.min?'orange':'green'}">${p.qty} un.</span></td><td><div class="actions"><button class="btn small" data-action="edit-product" data-id="${p.id}">Editar</button><button class="btn small" data-action="stock-move-product" data-id="${p.id}">Ajustar estoque</button><button class="btn small danger" data-action="delete-record" data-kind="product" data-id="${p.id}">Apagar</button></div></td></tr>`).join(''):`<tr><td colspan="8"><div class="empty">Nenhum produto encontrado.</div></td></tr>`}</tbody></table></div></section>`}
function clientsPage(){let arr=db.clients.filter(c=>(`${c.name} ${c.phone} ${c.bikes}`).toLowerCase().includes(clientSearch.toLowerCase()));return `${pageHead('Clientes','Mantenha os contatos e consulte o histórico de serviços.',`<button class="btn primary" data-action="new-client">＋ Novo cliente</button>`)}<div class="toolbar"><input class="search" id="clientSearch" placeholder="Buscar cliente ou telefone..." value="${escapeHtml(clientSearch)}"/></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Bicicleta cadastrada</th><th>Orçamentos</th><th>Total orçado</th><th></th></tr></thead><tbody>${arr.length?arr.map(c=>{const qs=db.quotes.filter(q=>q.clientId===c.id||q.clientName===c.name);return `<tr><td><div class="client-cell"><div class="client-dot">${escapeHtml(c.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><div><div class="item-title">${escapeHtml(c.name)}</div><div class="item-sub">${c.id}</div></div></div></td><td>${escapeHtml(c.phone||'—')}</td><td>${escapeHtml(c.bikes||'—')}</td><td>${qs.length}</td><td class="strong">${fmt(qs.reduce((s,q)=>s+quoteTotal(q),0))}</td><td><div class="action-group"><button class="btn small" data-action="edit-client" data-id="${c.id}">Editar</button><button class="btn small danger" data-action="delete-record" data-kind="client" data-id="${c.id}">Apagar</button></div></td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">Nenhum cliente cadastrado.</div></td></tr>`}</tbody></table></div></section>`}
function cashPage(){const income=db.quotes.reduce((s,q)=>s+paid(q),0)+db.sales.reduce((s,x)=>s+x.total,0);const expenses=db.expenses.reduce((s,x)=>s+x.amount,0);const costs=db.quotes.filter(q=>q.status==='approved').reduce((s,q)=>s+costTotal(q),0);return `${pageHead('Caixa e despesas','Registre recebimentos parciais, sinais, quitações e despesas.',`<button class="btn" data-action="new-expense">＋ Nova despesa</button><button class="btn" data-action="new-payment">＋ Pagamento de orçamento</button><button class="btn primary" data-action="new-income">＋ Entrada avulsa</button>`)}<div class="grid stats">${stat('Recebido',fmt(income),'Pagamentos registrados','＋')}${stat('Despesas registradas',fmt(expenses),'Saídas de caixa','−')}${stat('Saldo de caixa estimado',fmt(income-expenses),'Recebimentos menos despesas','＄')}${stat('A receber',fmt(db.quotes.filter(q=>q.status==='approved').reduce((s,q)=>s+due(q),0)),'Orçamentos aprovados','◷')}</div><div class="grid dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Pagamentos de clientes</h2><p>Valores registrados nos orçamentos</p></div></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Cliente / orçamento</th><th>Forma</th><th>Observação</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${[...db.quotes.flatMap(q=>(q.payments||[]).map(p=>({...p,q,kind:'payment'}))),...(db.sales||[]).map(x=>({...x,q:null,kind:'income',amount:x.total}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>`<tr><td>${dateFmt(p.date)}</td><td><div class="item-title">${escapeHtml(p.q?p.q.clientName:p.description||'Entrada avulsa')}</div><div class="item-sub">${p.q?p.q.id:'Venda / entrada manual'}</div></td><td>${escapeHtml(p.method||'—')}</td><td>${escapeHtml(p.note||(p.kind==='income'?'Entrada avulsa':'—'))}</td><td class="strong">${fmt(p.amount)}</td><td><button class="btn small danger" data-action="delete-record" data-kind="${p.kind}" data-id="${p.id}">Apagar</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">Nenhum recebimento registrado.</div></td></tr>`}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>Despesas</h2><p>Compras, contas e gastos da oficina</p></div></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${dateFmt(e.date)}</td><td class="strong">${escapeHtml(e.description)}</td><td>${escapeHtml(e.category)}</td><td>${fmt(e.amount)}</td><td><button class="btn small danger" data-action="delete-record" data-kind="expense" data-id="${e.id}">Apagar</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">Nenhuma despesa registrada.</div></td></tr>`}</tbody></table></div></section></div><p class="small-note" style="margin-top:15px">O saldo é um resumo operacional da demonstração, não uma conciliação bancária ou fiscal.</p>`}
function reportsPage(){const approved=db.quotes.filter(q=>q.status==='approved');const totalQuoted=approved.reduce((s,q)=>s+quoteTotal(q),0);const received=db.quotes.reduce((s,q)=>s+paid(q),0)+db.sales.reduce((s,x)=>s+x.total,0);const cogs=approved.reduce((s,q)=>s+costTotal(q),0);const expenses=db.expenses.reduce((s,e)=>s+e.amount,0);const gross=totalQuoted-cogs;const top=db.products.map(p=>({name:p.name,qty:db.movements.filter(m=>m.productId===p.id&&m.type==='out').reduce((s,m)=>s+m.qty,0)})).sort((a,b)=>b.qty-a.qty).slice(0,5);return `${pageHead('Relatórios','Indicadores calculados a partir dos dados desta demonstração.',`<button class="btn" data-action="export-report">⇩ Exportar resumo</button>`)}<div class="grid stats">${stat('Total aprovado',fmt(totalQuoted),'Soma dos orçamentos aprovados','▤')}${stat('Recebimentos',fmt(received),'Valores efetivamente registrados','＄')}${stat('Custo estimado das peças',fmt(cogs),'Custo cadastrado dos itens aprovados','▣')}${stat('Lucro bruto estimado',fmt(gross),'Total aprovado menos custo dos itens','↗')}</div><div class="grid report-grid"><section class="panel"><div class="panel-head"><div><h2>Resumo financeiro</h2><p>Visão geral acumulada</p></div></div><div class="bar-list">${[['Recebido',received],['A receber',approved.reduce((s,q)=>s+due(q),0)],['Despesas',expenses],['Lucro bruto estimado',gross]].map(([label,val])=>{const max=Math.max(received,approved.reduce((s,q)=>s+due(q),0),expenses,Math.abs(gross),1);return `<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(val)/max*100)}%;${label==='Despesas'?'background:var(--orange)':label.includes('Lucro')?'background:var(--blue)':''}"></div></div><strong style="text-align:right">${fmt(val)}</strong></div>`}).join('')}</div><p class="small-note" style="margin-top:18px">Lucro líquido real exige registrar todas as despesas e os custos de peças consumidas. Valores de orçamentos não equivalem necessariamente a receita realizada.</p></section><section class="panel"><div class="panel-head"><div><h2>Peças mais movimentadas</h2><p>Saídas registradas no histórico de estoque</p></div></div>${top.some(x=>x.qty>0)?top.map(t=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);gap:12px"><span>${escapeHtml(t.name)}</span><strong>${t.qty} un.</strong></div>`).join(''):`<div class="empty"><div class="empty-icon">▥</div><strong>Ainda sem dados de movimentação</strong>As saídas registradas aparecerão aqui.</div>`}</section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Indicadores operacionais</h2><p>Quantidade de atendimentos por etapa</p></div></div><div class="grid quick-grid">${[['Orçamentos',db.quotes.length],['Aguardando aprovação',db.quotes.filter(q=>q.status==='pending').length],['Em manutenção',db.quotes.filter(q=>q.status==='approved'&&q.workStatus==='progress').length],['Prontas para entrega',db.quotes.filter(q=>q.status==='approved'&&q.workStatus==='ready').length],['Entregues',db.quotes.filter(q=>q.workStatus==='done').length],['Clientes',db.clients.length]].map(([l,v])=>`<div class="quick"><span class="quick-icon">▦</span><span><strong>${l}</strong><small>${v} registro(s)</small></span></div>`).join('')}</div></section>`}
function settingsPage(){return `${pageHead('Configurações','Preferências, sincronização e backup.',`<button class="btn" data-action="export-backup">⇩ Baixar backup</button>`)}<section class="panel" style="max-width:720px"><div class="panel-head"><div><h2>Dados da bicicletaria</h2><p>Personalize o nome exibido no sistema</p></div></div><form id="settingsForm" class="form-grid"><div class="field full"><label>Nome da loja / oficina</label><input name="shopName" value="${escapeHtml(db.settings.shopName||'Oficina')}" required/></div><div class="field"><label>Moeda</label><select disabled><option>Real brasileiro (BRL)</option></select></div><div class="field"><label>Sincronização</label><input value="Supabase" disabled/></div><div class="full"><button class="btn primary" type="submit">Salvar preferências</button></div></form><p class="small-note" id="syncStatus" style="margin-top:14px">Dados sincronizados na conta conectada.</p><button class="btn danger" data-action="sign-out" style="margin-top:14px">Sair da conta</button></section>`}
function modal(title,sub,body,foot='',narrow=false){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal ${narrow?'narrow':''}" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${title}</h2><p>${sub||''}</p></div><button class="close" data-action="close-modal" aria-label="Fechar">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;document.body.style.overflow='hidden'}
function closeModal(){stopScanner();document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
function clientOptions(selected=''){return `<option value="">Selecionar cliente (opcional)</option>`+db.clients.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.name)} — ${escapeHtml(c.phone||'sem telefone')}</option>`).join('')}
function quoteModal(q=null){const isEdit=!!q;const x=q?structuredClone(q):{id:uid('ORC'),clientId:'',clientName:'',phone:'',brand:'',model:'',color:'',serial:'',defects:'',date:today(),validity:7,status:'pending',items:[],discount:0,notes:'',payments:[],workStatus:'waiting'};const body=`<form id="quoteForm"><input type="hidden" name="id" value="${x.id}"/><div class="section-label">Cliente e bicicleta</div><div class="form-grid"><div class="field full"><label>Cliente cadastrado</label><select name="clientId" id="quoteClient">${clientOptions(x.clientId)}</select><span class="small-note">Selecione um cliente ou preencha os dados abaixo para um atendimento novo.</span></div><div class="field"><label>Nome do cliente *</label><input name="clientName" id="quoteClientName" value="${escapeHtml(x.clientName)}" required placeholder="Nome completo"/></div><div class="field"><label>Telefone</label><input name="phone" id="quotePhone" value="${escapeHtml(x.phone)}" placeholder="(11) 99999-9999"/></div><div class="field"><label>Marca</label><input name="brand" value="${escapeHtml(x.brand)}" placeholder="Ex.: Caloi"/></div><div class="field"><label>Modelo</label><input name="model" value="${escapeHtml(x.model)}" placeholder="Ex.: Explorer 29"/></div><div class="field"><label>Cor</label><input name="color" value="${escapeHtml(x.color)}" placeholder="Cor da bicicleta"/></div><div class="field"><label>Número de série</label><input name="serial" value="${escapeHtml(x.serial)}" placeholder="Se disponível"/></div><div class="field full"><label>Defeitos relatados / pedido do cliente</label><textarea name="defects" placeholder="Descreva o que o cliente relatou...">${escapeHtml(x.defects)}</textarea></div></div><div class="section-label">Itens do orçamento</div><div class="notice">Você pode misturar peças do estoque, peças avulsas e mão de obra. Itens do estoque ficam reservados apenas no orçamento: a baixa é registrada quando a manutenção for concluída.</div><div id="quoteItems" class="items-box">${x.items.map((it,i)=>itemRow(it,i)).join('')}</div><div class="item-tools"><button type="button" class="btn small" data-action="add-item" data-type="stock">＋ Peça do estoque</button><button type="button" class="btn small" data-action="add-item" data-type="external">＋ Peça avulsa</button><button type="button" class="btn small" data-action="add-item" data-type="service">＋ Mão de obra / serviço</button><button type="button" class="btn small" data-action="add-item" data-type="custom">＋ Outro item</button></div><div class="form-grid" style="margin-top:17px"><div class="field"><label>Desconto (R$)</label><input name="discount" type="number" min="0" step="0.01" value="${x.discount||0}"/></div><div class="field"><label>Validade do orçamento (dias)</label><input name="validity" type="number" min="1" max="90" value="${x.validity||7}"/></div><div class="field"><label>Data</label><input name="date" type="date" value="${x.date||today()}"/></div><div class="field full"><label>Observações do orçamento</label><textarea name="notes" placeholder="Prazo previsto, condições ou observações...">${escapeHtml(x.notes)}</textarea></div></div><div id="quoteTotals" class="totals"></div></form>`;modal(isEdit?'Editar orçamento':'Novo orçamento','Preencha a ficha e adicione os itens necessários.',body,`<button class="btn" data-action="close-modal">Cancelar</button><div class="actions"><button class="btn" data-action="save-quote" data-id="${x.id}">Salvar orçamento</button><button class="btn primary" data-action="save-quote-approve" data-id="${x.id}">Salvar e aprovar</button></div>`);refreshQuoteTotals();const sel=document.getElementById('quoteClient');sel.addEventListener('change',()=>{const c=db.clients.find(c=>c.id===sel.value);if(c){document.getElementById('quoteClientName').value=c.name;document.getElementById('quotePhone').value=c.phone||''}});document.getElementById('quoteItems').addEventListener('input',refreshQuoteTotals);document.getElementById('quoteItems').addEventListener('change',e=>{if(e.target.matches('[data-item-product]')){const p=db.products.find(p=>p.id===e.target.value);const row=e.target.closest('.item-row');if(p){row.querySelector('[data-item-description]').value=p.name;row.querySelector('[data-item-price]').value=p.sale;row.querySelector('[data-item-cost]').value=p.cost;row.querySelector('[data-item-code]').value=p.code||'';refreshQuoteTotals()}}});}
function itemRow(it={},i=0){const type=it.type||'service';return `<div class="item-row" data-item-row><div class="field"><label>${type==='stock'?'Peça do estoque':type==='external'?'Peça avulsa':type==='service'?'Serviço / mão de obra':'Descrição do item'}</label>${type==='stock'?`<select data-item-product><option value="">Selecionar peça...</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===it.productId?'selected':''}>${escapeHtml(p.name)} · ${p.qty} un.</option>`).join('')}</select><input data-item-description value="${escapeHtml(it.description||'')}" class="hide"/>`:`<input data-item-description value="${escapeHtml(it.description||'')}" placeholder="${type==='service'?'Ex.: Regulagem de câmbio':'Descrição'}" required/>`}<input type="hidden" data-item-type value="${type}"/><input type="hidden" data-item-code value="${escapeHtml(it.code||'')}"/><input type="hidden" data-item-cost value="${Number(it.cost)||0}"/></div><div class="field"><label>Qtd.</label><input data-item-qty type="number" min="0.01" step="0.01" value="${it.qty??1}" required/></div><div class="field"><label>Preço unit. (R$)</label><input data-item-price type="number" min="0" step="0.01" value="${it.price??0}" required/></div><div class="field"><label>Total</label><input data-item-total value="${fmt((+it.qty||0)*(+it.price||0))}" disabled/></div><button type="button" class="remove" data-action="remove-item" title="Remover item">×</button></div>`}
function refreshQuoteTotals(){const rows=[...document.querySelectorAll('[data-item-row]')];let subtotal=0;rows.forEach(r=>{const qty=+(r.querySelector('[data-item-qty]')?.value||0),price=+(r.querySelector('[data-item-price]')?.value||0);subtotal+=qty*price;const total=r.querySelector('[data-item-total]');if(total)total.value=fmt(qty*price)});const discount=+(document.querySelector('#quoteForm [name=discount]')?.value||0);const el=document.getElementById('quoteTotals');if(el)el.innerHTML=`<div class="total-line"><span>Subtotal (${rows.length} itens)</span><strong>${fmt(subtotal)}</strong></div><div class="total-line"><span>Desconto</span><strong>− ${fmt(discount)}</strong></div><div class="total-line final"><span>Total do orçamento</span><span>${fmt(Math.max(0,subtotal-discount))}</span></div>`}
function readQuoteForm(){const f=document.getElementById('quoteForm');const v=Object.fromEntries(new FormData(f).entries());const items=[...document.querySelectorAll('[data-item-row]')].map(r=>{const type=r.querySelector('[data-item-type]').value;const productId=r.querySelector('[data-item-product]')?.value||'';const p=db.products.find(p=>p.id===productId);return {id:uid('IT'),type,productId:productId||null,description:(r.querySelector('[data-item-description]').value||p?.name||'').trim(),code:r.querySelector('[data-item-code]').value||p?.code||'',qty:+r.querySelector('[data-item-qty]').value,price:+r.querySelector('[data-item-price]').value,cost:+r.querySelector('[data-item-cost]').value||p?.cost||0}});return {...v,clientId:v.clientId||null,clientName:v.clientName.trim(),phone:v.phone.trim(),discount:+v.discount||0,validity:+v.validity||7,items,payments:[],createdAt:Date.now()}}
function addItem(type){const box=document.getElementById('quoteItems');box.insertAdjacentHTML('beforeend',itemRow({type,qty:1,price:0,cost:0},box.children.length));refreshQuoteTotals()}
function saveQuote(id,approve=false){const f=document.getElementById('quoteForm');if(!f.reportValidity())return;const q=readQuoteForm();if(!q.items.length){toast('Adicione pelo menos um item ao orçamento.');return}if(q.items.some(i=>!i.description||i.qty<=0||i.price<0)){toast('Confira a descrição, quantidade e preço dos itens.');return}const old=db.quotes.find(x=>x.id===id);if(old){q.payments=old.payments||[];q.createdAt=old.createdAt;q.workStatus=old.workStatus||'waiting';q.status=old.status==='approved'?'approved':old.status}else{q.status='pending';q.workStatus='waiting'}if(approve)q.status='approved';const ix=db.quotes.findIndex(x=>x.id===id);if(ix>=0)db.quotes[ix]=q;else db.quotes.unshift(q);if(q.clientName&&!db.clients.some(c=>c.name.toLowerCase()===q.clientName.toLowerCase()))db.clients.push({id:q.clientId||uid('C'),name:q.clientName,phone:q.phone,bikes:[q.brand,q.model,q.color].filter(Boolean).join(' · ')});save();closeModal();render();toast(approve?'Orçamento salvo e aprovado.':'Orçamento salvo.');}
function viewQuote(id){const q=db.quotes.find(q=>q.id===id);if(!q)return;const body=`<div class="summary-strip"><div class="summary-chip">Número <strong>${q.id}</strong></div><div class="summary-chip">Status <strong>${badge(q.status)}</strong></div><div class="summary-chip">Data <strong>${dateFmt(q.date)}</strong></div></div><div class="grid form-grid"><div><div class="section-label">Cliente</div><div class="item-title">${escapeHtml(q.clientName)}</div><div class="item-sub">${escapeHtml(q.phone||'Sem telefone')}</div></div><div><div class="section-label">Bicicleta</div><div class="item-title">${escapeHtml([q.brand,q.model].filter(Boolean).join(' ')||'Não informada')}</div><div class="item-sub">${escapeHtml([q.color,q.serial?'Série: '+q.serial:''].filter(Boolean).join(' · ')||'Sem detalhes adicionais')}</div></div><div class="full"><div class="section-label">Defeitos relatados</div><p>${escapeHtml(q.defects||'Não informado')}</p></div></div><div class="section-label">Itens do orçamento</div><div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Qtd.</th><th>Unitário</th><th>Total</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${i.type==='stock'?'Estoque':i.type==='external'?'Peça avulsa':i.type==='service'?'Serviço':'Outro'}</td><td>${escapeHtml(i.description)}</td><td>${i.qty}</td><td>${fmt(i.price)}</td><td class="strong">${fmt(i.qty*i.price)}</td></tr>`).join('')}</tbody></table></div><div class="totals"><div class="total-line"><span>Subtotal</span><strong>${fmt(q.items.reduce((s,i)=>s+i.qty*i.price,0))}</strong></div><div class="total-line"><span>Desconto</span><strong>− ${fmt(q.discount)}</strong></div><div class="total-line final"><span>Total</span><span>${fmt(quoteTotal(q))}</span></div><div class="total-line"><span>Recebido</span><strong>${fmt(paid(q))}</strong></div><div class="total-line"><span>Saldo</span><strong>${fmt(due(q))}</strong></div></div>${q.notes?`<div class="section-label">Observações</div><p>${escapeHtml(q.notes)}</p>` alvar peça</button>`,true)}

function changeWorkStatus(id,status){const q=db.quotes.find(q=>q.id===id);if(!q)return;if(status==='done'&&!q.stockDeducted){const stockItems=(q.items||[]).filter(i=>i.type==='stock'&&i.productId);const insufficient=stockItems.find(i=>{const p=db.products.find(p=>p.id===i.productId);return p&&p.qty<i.qty});if(insufficient){toast('Estoque insuficiente para '+insufficient.description+'. Registre a entrada ou ajuste antes de concluir.');return}stockItems.forEach(i=>{const p=db.products.find(p=>p.id===i.productId);if(p){p.qty-=i.qty;db.movements.push({id:uid('MOV'),productId:p.id,type:'out',qty:i.qty,note:'Peça usada no serviço '+q.id+' (finalizado)',date:today()})}});q.stockDeducted=true}q.workStatus=status;if(status==='done')q.completedAt=today();save();render();toast(status==='done'?(q.stockDeducted?'Serviço finalizado. Peças utilizadas baixadas do estoque.':'Serviço finalizado.'):'Etapa da manutenção atualizada.')}
let scannerStream=null,scannerFrame=null,scannerActive=false,scannerControls=null,scannerReader=null;
function stopScanner(){scannerActive=false;if(scannerFrame)cancelAnimationFrame(scannerFrame);scannerFrame=null;if(scannerControls){try{scannerControls.stop()}catch(e){}scannerControls=null}if(scannerReader){try{scannerReader.reset()}catch(e){}scannerReader=null}if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}const video=document.getElementById('scannerVideo');if(video){video.pause?.();video.srcObject=null}}
async function loadZXing(){
 if(window.ZXing&&window.ZXing.BrowserMultiFormatReader)return true;
 if(!window.isSecureContext){throw new Error('SECURE_CONTEXT')}
 await new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-zxing-loader]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});if(window.ZXing)resolve();return}const script=document.createElement('script');script.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';script.async=true;script.dataset.zxingLoader='1';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)});
 return !!(window.ZXing&&window.ZXing.BrowserMultiFormatReader)
}
function useScannedCode(code){if(!code)return;code=String(code).trim();const field=document.getElementById('productCode');if(field)field.value=code;stopScanner();const box=document.getElementById('scannerBox');if(box)box.hidden=true;const existing=db.products.find(p=>String(p.code||'').trim()===code);if(existing){toast('Código encontrado: '+existing.name+'. Abrindo o cadastro existente.');closeModal();productModal(existing)}else{toast('Código lido: '+code);document.getElementById('productCode')?.focus()}}
async function startScanner(){
 const box=document.getElementById('scannerBox'),video=document.getElementById('scannerVideo'),status=document.getElementById('scannerStatus');
 if(!box||!video||!status)return;box.hidden=false;status.textContent='Solicitando permissão para usar a câmera…';
 if(!window.isSecureContext){status.textContent='A câmera só funciona em um endereço seguro (HTTPS) ou em localhost. Publique o site no Vercel ou em outro serviço HTTPS e abra o link https:// no Chrome. Abrir este arquivo diretamente pelo celular geralmente bloqueia a câmera.';return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='Este navegador não oferece acesso à câmera. Abra o site no Chrome atualizado usando HTTPS.';return}
 try{
  // Solicita a câmera primeiro, para que o navegador possa mostrar o pedido de permissão.
  scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  video.srcObject=scannerStream;await video.play();scannerActive=true;
  if('BarcodeDetector' in window){
   const supported=await BarcodeDetector.getSupportedFormats();
   const formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'].filter(f=>supported.includes(f));
   if(formats.length){const detector=new BarcodeDetector({formats});status.textContent='Câmera ligada. Aponte para o código de barras e mantenha a etiqueta bem iluminada.';
    const scan=async()=>{if(!scannerActive)return;try{if(video.readyState>=2){const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){useScannedCode(codes[0].rawValue);return}}}catch(err){}scannerFrame=requestAnimationFrame(scan)};scannerFrame=requestAnimationFrame(scan);return;
   }
  }
  // Compatibilidade com navegadores sem BarcodeDetector: carrega leitor alternativo.
  status.textContent='Câmera ligada. Preparando leitor compatível…';
  const loaded=await loadZXing();
  if(!loaded)throw new Error('NO_READER');
  // Libera a primeira captura e deixa a biblioteca controlar a câmera, com permissão já concedida.
  if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}video.srcObject=null;
  scannerReader=new window.ZXing.BrowserMultiFormatReader();
  scannerReader.decodeFromVideoDevice(undefined,video,(result,err,controls)=>{if(controls)scannerControls=controls;if(result&&result.getText){useScannedCode(result.getText())}else if(scannerActive&&err&&!(err instanceof window.ZXing.NotFoundException)){status.textContent='Mantenha o código inteiro dentro da imagem e tente novamente.'}});
  scannerActive=true;status.textContent='Aponte a câmera para o código de barras. Mantenha a etiqueta bem iluminada.';
 }catch(err){stopScanner();if(err&&err.name==='NotAllowedError'){status.textContent='O navegador bloqueou a câmera ou a permissão já foi negada. No Chrome, toque no ícone ao lado do endereço do site → Permissões → Câmera → Permitir. Depois recarregue a página e toque em Ler novamente.'}else if(err&&err.name==='NotFoundError'){status.textContent='Não encontrei uma câmera disponível neste aparelho.'}else if(err&&err.message==='SECURE_CONTEXT'){status.textContent='A câmera exige um endereço HTTPS. Publique o HTML no Vercel e abra o link https:// do site.'}else{status.textContent='Não foi possível iniciar o leitor. Confirme que o endereço começa com https://, permita a câmera nas configurações do navegador e confira a conexão com a internet para carregar o leitor compatível. Você também pode digitar o código manualmente.'}}
}
function bindPage(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.querySelectorAll('[data-qfilter]').forEach(b=>b.onclick=()=>{quoteFilter=b.dataset.qfilter;render()});const qs=document.getElementById('quoteSearch');if(qs)qs.oninput=e=>{quoteSearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('quoteSearch');n.focus();n.setSelectionRange(pos,pos)};const is=document.getElementById('inventorySearch');if(is)is.oninput=e=>{inventorySearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('inventorySearch');n.focus();n.setSelectionRange(pos,pos)};const cs=document.getElementById('clientSearch');if(cs)cs.oninput=e=>{clientSearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('clientSearch');n.focus();n.setSelectionRange(pos,pos)};const sf=document.getElementById('settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();db.settings.shopName=new FormData(sf).get('shopName');save();toast('Preferências salvas.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='delete-record'){const kind=b.dataset.kind;let message='';if(kind==='product')message='Apagar esta peça do cadastro? O histórico de orçamentos será mantido.';else if(kind==='quote')message='Apagar este orçamento e os pagamentos vinculados? Essa ação não pode ser desfeita.';else if(kind==='client')message='Apagar este cliente? Os orçamentos antigos serão mantidos.';else if(kind==='expense')message='Apagar esta despesa do caixa?';else if(kind==='payment')message='Apagar este recebimento do orçamento?';else if(kind==='income')message='Apagar esta entrada avulsa do caixa?';if(!confirm(message+'\n\nSe tiver dúvida, cancele e faça um backup antes.'))return;if(kind==='product'){db.products=db.products.filter(x=>x.id!==id)}else if(kind==='quote'){db.quotes=db.quotes.filter(x=>x.id!==id)}else if(kind==='client'){db.clients=db.clients.filter(x=>x.id!==id)}else if(kind==='expense'){db.expenses=db.expenses.filter(x=>x.id!==id)}else if(kind==='payment'){db.quotes.forEach(q=>q.payments=(q.payments||[]).filter(p=>p.id!==id))}else if(kind==='income'){db.sales=db.sales.filter(x=>x.id!==id)}save();closeModal();render();toast('Registro apagado.');return}if(a==='backdrop-close'&&e.target===b){closeModal();return}if(a==='close-modal'){closeModal();return}if(a==='new-quote'){quoteModal();return}if(a==='edit-quote'){const q=db.quotes.find(q=>q.id===id);closeModal();quoteModal(q);return}if(a==='view-quote'){viewQuote(id);return}if(a==='save-quote'||a==='save-quote-approve'){saveQuote(id,a==='save-quote-approve');return}if(a==='add-item'){addItem(b.dataset.type);return}if(a==='remove-item'){b.closest('[data-item-row]').remove();refreshQuoteTotals();return}if(a==='approve-quote'){approveQuote(id);return}if(a==='reject-quote'){const q=db.quotes.find(q=>q.id===id);if(q){q.status='rejected';save();closeModal();render();toast('Orçamento marcado como rejeitado.')}return}if(a==='work-status'){changeWorkStatus(id,b.dataset.status);return}if(a==='goto-workshop'){closeModal();setPage('workshop');return}if(a==='new-product'){productModal();return}if(a==='edit-product'){productModal(db.products.find(p=>p.id===id));return}if(a==='save-product'){const f=document.getElementById('productForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f).entries());const old=db.products.find(p=>p.id===v.id);const product={id:v.id||uid('P'),name:v.name.trim(),code:v.code.trim(),category:v.category.trim(),cost:+v.cost,sale:+v.sale,qty:+v.qty,min:+v.min||0};if(old){const delta=product.qty-old.qty;if(delta)db.movements.push({id:uid('MOV'),productId:product.id,type:delta>0?'in':'out',qty:Math.abs(delta),note:'Ajuste ao editar cadastro',date:today()});db.products[db.products.findIndex(p=>p.id===v.id)]=product}else{db.products.push(product);if(product.qty)db.movements.push({id:uid('MOV'),productId:product.id,type:'in',qty:product.qty,note:'Estoque inicial',date:today()})}save();closeModal();render();toast('Peça salva.');return}if(a==='stock-entry'){stockMoveModal();return}if(a==='stock-move-product'){stockMoveModal(id);return}if(a==='save-stock-move'){const f=document.getElementById('stockForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f).entries());const p=db.products.find(p=>p.id===v.productId);if(!p)return;const qty=+v.qty;if(v.type==='in')p.qty+=qty;else if(v.type==='out'){if(qty>p.qty){toast('A quantidade de saída é maior que o saldo.');return}p.qty-=qty}else p.qty=qty;db.movements.push({id:uid('MOV'),productId:p.id,type:v.type,qty,note:v.note||'Movimentação manual',date:today()});save();closeModal();render();toast('Estoque atualizado.');return}if(a==='new-client'){clientModal();return}if(a==='edit-client'){clientModal(db.clients.find(c=>c.id===id));return}if(a==='save-client'){const f=document.getElementById('clientForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f).entries());const c={id:v.id||uid('C'),name:v.name.trim(),phone:v.phone.trim(),bikes:v.bikes.trim()};const ix=db.clients.findIndex(x=>x.id===v.id);if(ix>=0)db.clients[ix]=c;else db.clients.push(c);save();closeModal();render();toast('Cliente salvo.');return}if(a==='new-payment'){paymentModal(id||'');return}if(a==='new-income'){incomeModal();return}if(a==='save-income'){const f=document.getElementById('incomeForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f).entries());db.sales.push({id:uid('ENT'),description:v.description.trim(),total:+v.amount,date:v.date,method:v.method,note:v.note||''});save();closeModal();render();toast('Entrada registrada no caixa.');return}if(a==='save-payment'){const f=document.getElementById('paymentForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f).entries());const q=db.quotes.find(q=>q.id===v.quoteId);if(!q)return;if(+v.amount<=0){toast('Informe um valor válido.');return}q.payments=q.payments||[];q.payments.push({id:uid('PG'),amount:+v.amount,date:v.date,method:v.method,note:v.note});save();closeModal();render();toast('Recebimento registrado.');return}if(a==='new-expense'){expenseModal();return}if(a==='save-expense'){const f=document.getElementById('expenseForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f).entries());db.expenses.push({id:uid('DESP'),description:v.description.trim(),category:v.category,amount:+v.amount,date:v.date,note:v.note});save();closeModal();render();toast('Despesa registrada.');return}if(a==='export-products'){exportCSV('estoque-bicicletaria.csv',[['ID','Produto','Código','Categoria','Custo','Preço de venda','Quantidade','Mínimo'],...db.products.map(p=>[p.id,p.name,p.code,p.category,p.cost,p.sale,p.qty,p.min])]);return}if(a==='export-quotes'){exportCSV('orcamentos-bicicletaria.csv',[['Número','Cliente','Telefone','Data','Bicicleta','Status','Total','Recebido','Saldo'],...db.quotes.map(q=>[q.id,q.clientName,q.phone,q.date,[q.brand,q.model,q.color].join(' '),q.status,quoteTotal(q),paid(q),due(q)])]);return}if(a==='export-report'){exportCSV('relatorio-bicicletaria.csv',[['Indicador','Valor'],['Orçamentos',db.quotes.length],['Total aprovado',db.quotes.filter(q=>q.status==='approved').reduce((s,q)=>s+quoteTotal(q),0)],['Recebido',db.quotes.reduce((s,q)=>s+paid(q),0)+db.sales.reduce((s,x)=>s+x.total,0)],['Despesas',db.expenses.reduce((s,x)=>s+x.amount,0)],['Clientes',db.clients.length],['Produtos',db.products.length]]);return}if(a==='export-backup'){exportBackup();return}if(a==='sign-out'){signOut();return}if(a==='start-scan'){startScanner();return}if(a==='stop-scan'){stopScanner();const box=document.getElementById('scannerBox');if(box)box.hidden=true;return}});
document.addEventListener('submit',e=>{if(e.target.id==='quoteForm'){e.preventDefault()} });

async function showAuth(message=''){
 const root=document.getElementById('authRoot');root.hidden=false;document.getElementById('appRoot').hidden=true;root.classList.add('auth-root');
 root.innerHTML=`<section class="auth-card"><div class="auth-brand">OFICINA · GESTÃO</div><h1>Acesse sua conta</h1><p>Entre para acessar os dados da bicicletaria e sincronizá-los entre dispositivos.</p><form id="authForm"><div class="field"><label for="authEmail">E-mail</label><input id="authEmail" name="email" type="email" autocomplete="email" required placeholder="seu@email.com"></div><div class="field"><label for="authPassword">Senha</label><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Mínimo de 6 caracteres"></div><button type="submit">Entrar</button><button type="button" class="secondary" id="signupButton">Criar conta</button><div class="auth-message" id="authMessage">${escapeHtml(message)}</div></form></section>`;
 const authForm=document.getElementById('authForm');
 authForm.onsubmit=async e=>{
  e.preventDefault();
  const submitButton=authForm.querySelector('button[type="submit"]');
  const fd=new FormData(authForm);const email=String(fd.get('email')||'').trim();const password=String(fd.get('password')||'');
  const msg=document.getElementById('authMessage');
  if(!supabaseClient){msg.textContent='O acesso seguro ainda está iniciando. Recarregue a página e tente novamente.';return}
  submitButton.disabled=true;submitButton.textContent='Entrando…';msg.textContent='Verificando e-mail e senha…';
  try{
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
   if(error){msg.textContent=error.message==='Invalid login credentials'?'E-mail ou senha incorretos. Confira os dados e tente novamente.':error.message;return}
   if(!data?.user){msg.textContent='O Supabase não retornou um usuário. Confira se o e-mail foi confirmado.';return}
   await startApp(data.user);
  }catch(err){
   console.error('Erro ao entrar:',err);
   msg.textContent='Falha de conexão ao entrar. Confira a internet e tente novamente.';
  }finally{
   if(submitButton.isConnected){submitButton.disabled=false;submitButton.textContent='Entrar'}
  }
 };
 document.getElementById('signupButton').onclick=async()=>{
  const email=document.getElementById('authEmail').value.trim();const password=document.getElementById('authPassword').value;const msg=document.getElementById('authMessage');const button=document.getElementById('signupButton');
  if(!supabaseClient){msg.textContent='O acesso seguro ainda está iniciando. Recarregue a página e tente novamente.';return}
  if(!email||password.length<6){msg.textContent='Informe um e-mail válido e uma senha com pelo menos 6 caracteres.';return}
  button.disabled=true;msg.textContent='Verificando cadastro…';
  try{
   const {data,error}=await supabaseClient.auth.signUp({email,password});
   if(error){msg.textContent=error.message;return}
   if(data.session&&data.user){await startApp(data.user)}
   else{msg.textContent='Cadastro encontrado/criado. Confirme o e-mail se o Supabase solicitar e depois entre com a mesma senha.'}
  }catch(err){console.error('Erro no cadastro:',err);msg.textContent='Falha de conexão ao cadastrar. Confira a internet e tente novamente.'}
  finally{button.disabled=false}
 };
}
async function startApp(user){
 if(sessionUser&&sessionUser.id===user.id&&document.getElementById('appRoot')&&!document.getElementById('appRoot').hidden)return;
 sessionUser=user;const authRoot=document.getElementById('authRoot');authRoot.innerHTML='';authRoot.hidden=true;document.getElementById('appRoot').hidden=false;
 setSyncStatus('Carregando dados da conta…');syncing=false;
 try{const {data,error}=await supabaseClient.from(TABLE).select('app_data').eq('user_id',user.id).maybeSingle();if(error)throw error;db=data&&data.app_data?normalizeData(data.app_data):emptyData();localStorage.setItem(KEY,JSON.stringify(db));}
 catch(err){setSyncStatus('Erro ao carregar dados. Verifique a tabela e as políticas SQL do Supabase.');console.error('Supabase load:',err);db=emptyData()}
 syncing=true;render();setSyncStatus('Conta conectada · sincronização ativa');
}
function normalizeData(d){const base=emptyData();return {...base,...(d||{}),products:Array.isArray(d?.products)?d.products:[],clients:Array.isArray(d?.clients)?d.clients:[],quotes:Array.isArray(d?.quotes)?d.quotes:[],expenses:Array.isArray(d?.expenses)?d.expenses:[],movements:Array.isArray(d?.movements)?d.movements:[],sales:Array.isArray(d?.sales)?d.sales:[],settings:{...base.settings,...(d?.settings||{})}}}
async function signOut(){if(!confirm('Deseja sair da conta?'))return;syncing=false;await supabaseClient.auth.signOut();sessionUser=null;db=emptyData();showAuth('Você saiu da conta.');}
async function init(){
 // Inicializa o cliente sem bloquear o formulário esperando a restauração da sessão.
 // O lock padrão pode ficar preso em alguns navegadores quando a página foi recarregada
 // após uma tentativa interrompida; usamos um lock simples para não bloquear o login.
 try{
  if(!window.supabase){
   const msg=document.getElementById('authMessage');
   if(msg)msg.textContent='A biblioteca de acesso não carregou. Confira a internet e recarregue a página.';
   return;
  }
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    lock: async (_name, _acquireTimeout, fn) => await fn()
   },
   global:{headers:{'X-Client-Info':'oficina-bicicletaria-web'}}
  });
  supabaseClient.auth.onAuthStateChange((event,session)=>{
   if(event==='SIGNED_OUT'){
    sessionUser=null;syncing=false;db=emptyData();showAuth('Você saiu da conta.');
   }else if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&session?.user&&!sessionUser){
    startApp(session.user);
   }
  });
  // Recupera sessão em segundo plano; falha aqui não impede o envio do formulário.
  supabaseClient.auth.getSession().then(({data,error})=>{
   if(error) console.warn('Restauração de sessão:',error);
   if(data?.session?.user&&!sessionUser) startApp(data.session.user);
  }).catch(err=>console.warn('Restauração de sessão:',err));
 }catch(err){
  console.error('Falha na inicialização do Supabase:',err);
  const msg=document.getElementById('authMessage');
  if(msg)msg.textContent='Não foi possível preparar o acesso: '+(err?.message||'erro desconhecido');
 }
}

updateNav();init();
})();
</script>
